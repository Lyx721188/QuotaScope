<!--
  Apple's macOS app icon grid, since Big Sur: the artwork is a rounded square of
  824 centred on a 1024 canvas, corner radius 185.4, with the 100 of margin all
  round left for the shadow.

  macOS does **not** mask app icons the way iOS does — whatever is supplied is
  what is drawn, at every size and in every list. A full-bleed square therefore
  shows as a hard-edged square beside every other app on the Dock.

  The mark is `pulse-mark.svg`: a P drawn in one stroke, the stem the screen
  edge the panel docks to and the bowl a ring left open, as a usage ring is
  until it is spent. The gap between the bowl's end and the stem is the idea —
  close it and it is only a letter.

  Here the bowl is lime and the stem white, so the ring reads as the ring. The
  colour changes exactly at the stem's right edge: the stem is one stroke that
  turns the corner and stops there, and the bowl starts butt-ended on the same
  line and covers the stem's end cap. One stroke, because two white pieces
  meeting leave an antialiased seam. The mark alone (`pulse-mark.svg`) stays one colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Linear, not radial: a radial ramp this dark bands into visible rings
         once it is rasterised to 8 bits. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1B1E" />
      <stop offset="100%" stop-color="#0A0A0B" />
    </linearGradient>

    <!-- Baked in, because an .icns carries no shadow of its own. Kept soft and
         low: at 16pt it should read as a seated edge, not as a smudge. -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.30" />
    </filter>
  </defs>

  <!-- The shadow is cast by a flat copy underneath: filtering the gradient
       body itself rasterises in tiles, and each tile shows as a band. -->
  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"
    fill="#0A0A0B" filter="url(#shadow)" />
  <rect x="100" y="100" width="824" height="824" rx="185.4" ry="185.4"
    fill="url(#bg)" />

  <!-- The mark's own 1024 space, scaled into the body about its centre. -->
  <g transform="translate(512 512) scale(0.64) translate(-532 -512)">
    <g fill="none" stroke-width="100" stroke-linejoin="round">
      <path d="M352 780 V244 H402" stroke="#F5F5F1" stroke-linecap="round" />
      <path d="M402 244 H562 A150 150 0 0 1 562 544 H490" stroke="#C8F03C" />
      <circle cx="490" cy="544" r="50" fill="#C8F03C" stroke="none" />
    </g>
  </g>
</svg>
