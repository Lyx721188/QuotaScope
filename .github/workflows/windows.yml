name: Windows build

# Builds the Windows-native Rust application in `windows/`.

on:
  push:
    branches: ["**"]
    # A windows-v* tag publishes the build as a Release (see the release job).
    tags: ["windows-v*"]
    paths:
      - "windows/**"
      - "README.md"
      - "Docs/**"
      - "THIRD_PARTY_NOTICES.md"
      - "CHANGELOG.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          # The windows-rs crate compiles thousands of feature-gated FFI
          # bindings; without a cache every push pays that cost twice (debug
          # for tests, release for the artifact).

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked

      # Smoke test for the status-line contract: `--json` must print a valid
      # document and exit 0 without touching the network or the keyring.
      - name: --json smoke test
        shell: pwsh
        run: |
          $out = & ./target/release/quotascope.exe --json | Out-String
          $out | Out-File -FilePath "$env:TEMP\quotascope-json.txt" -Encoding utf8
          $json = Get-Content "$env:TEMP\quotascope-json.txt" -Raw | ConvertFrom-Json
          if (-not ($json.PSObject.Properties.Name -contains "generatedAt") -or
              -not ($json.PSObject.Properties.Name -contains "accounts")) {
            Write-Host $out
            throw "--json output is not the documented shape"
          }
          Write-Host "smoke test OK: $($json.accounts.Count) account(s) on the rail"

      # The self-contained setup copies DLLs, PRI resource indexes and locale
      # folders next to the exe. All three are required by WinUI at runtime.
      - name: Zip the release folder
        shell: pwsh
        run: |
          $release = (Resolve-Path target/release).Path
          $staging = Join-Path $env:RUNNER_TEMP "quotascope-windows-x64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          Copy-Item (Join-Path $release "quotascope.exe") $staging
          Get-ChildItem $release -File |
            Where-Object { $_.Extension -in ".dll", ".pri" } |
            Copy-Item -Destination $staging
          Get-ChildItem $release -Directory |
            Where-Object { $_.Name -notin ".fingerprint", "build", "deps", "examples", "incremental" } |
            Copy-Item -Destination $staging -Recurse

          $archive = Join-Path $release "quotascope-windows-x64.zip"
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force
          Write-Host (Get-Item $archive).Length

      - name: Build installer and stage release assets
        shell: pwsh
        run: |
          ./installer/build-installer.ps1 -SkipBuild
          $manifest = Get-Content Cargo.toml -Raw
          $version = [regex]::Match($manifest, '(?m)^version\s*=\s*"([^\"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "windows-v$version") {
            throw 'Release tag does not match the workspace version'
          }
          $assets = Join-Path (Get-Location) 'target/release-assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item -LiteralPath 'target/release/quotascope-windows-x64.zip' -Destination $assets
          Copy-Item -LiteralPath "target/installer/QuotaScope-$version-windows-x64-Setup.exe", "target/installer/QuotaScope-$version-windows-x64-Setup.exe.sha256" -Destination $assets
          $zip = Join-Path $assets 'quotascope-windows-x64.zip'
          $digest = Get-FileHash -LiteralPath $zip -Algorithm SHA256
          "$($digest.Hash)  quotascope-windows-x64.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ascii

      # Exercise the files users actually download. Missing PRI files can let
      # WinUI launch and then fail several seconds later with 0xc000027b.
      - name: Packaged settings lifecycle regression
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "quotascope-package-smoke"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Expand-Archive target/release/quotascope-windows-x64.zip -DestinationPath $package -Force

          $env:QUOTASCOPE_TEST_EXE = Join-Path $package "quotascope.exe"
          cargo test -p quotascope-win --test settings_lifecycle --locked -- --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw "Packaged Settings lifecycle regression failed" }

      - name: Upload quotascope-windows-x64
        uses: actions/upload-artifact@v4
        with:
          name: quotascope-windows-x64
          path: windows/target/release-assets/*
          if-no-files-found: error

  # Tag windows-v*, and the assets the build job just made become a
  # Release. The version for the title comes from the tag itself; the build
  # job remains the single place that decides what a shipped quotascope.exe is.
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: quotascope-windows-x64

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="QuotaScope for Windows ${GITHUB_REF_NAME#windows-v}"
          BODY="Windows x64 release of QuotaScope ${GITHUB_REF_NAME#windows-v}. Requires Windows 10 1809+ or Windows 11."
          BODY="$BODY

          **Install:** run \`QuotaScope-${GITHUB_REF_NAME#windows-v}-windows-x64-Setup.exe\` for a per-user installation with Start menu shortcuts and an uninstaller. The installer is unsigned; Windows may show an unknown-publisher prompt.

          **Portable:** unzip \`quotascope-windows-x64.zip\` and run \`quotascope.exe\`. WinAppSDK runtime files are included.

          Right-click the tray icon to open settings. The SHA-256 checksum is included beside the installer."

          # Re-runnable: a re-tag or a re-run replaces the asset in place
          # instead of failing on an existing release.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" quotascope-windows-x64.zip* QuotaScope-*-windows-x64-Setup.exe* --clobber
            echo "Updated existing release $GITHUB_REF_NAME."
          else
            gh release create "$GITHUB_REF_NAME" quotascope-windows-x64.zip* QuotaScope-*-windows-x64-Setup.exe* \
              --title "$TITLE" \
              --notes "$BODY"
          fi
